<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reoka B · Ví thẻ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/gallery.css">
<style>
/* Template B, "Ví thẻ": a pet wallet.
   Each pet is a physical-feeling pass; cards stack like a wallet and flip to a QR side.
   Softer mint world, bigger radii, Lexend for friendly legibility. */
:root {
  --font: "Lexend", system-ui, sans-serif;
  --teal: #087F8C; --teal-d: #056570; --navy: #17324D; --mint: #DDF4EF; --mint-2: #C5EAE2;
  --muted: #587184; --faint: #8DA1AF; --line: #DCEBE7; --page: #F2F9F7;
  --due: #9E4A0C; --due-bg: #FFEFD9; --ok: #1B6F46; --ok-bg: #DDF3E6; --danger: #B83232;
  --app-bg: var(--page);
}
.screen { font-family: var(--font); color: var(--navy); font-size: 14.5px; line-height: 1.45; font-weight: 400; }
.content { flex: 1; overflow: hidden; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 18px; }
.h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; }
.h2 { margin: 0 0 10px; font-size: 16px; font-weight: 500; display: flex; justify-content: space-between; align-items: baseline; }
.h2 a { font-size: 13px; color: var(--teal); font-weight: 500; text-decoration: none; }
.muted { color: var(--muted); }
p { margin: 0; }

/* the pass */
.pass { position: relative; border-radius: 22px; background: #fff; overflow: hidden; box-shadow: 0 18px 30px -22px rgba(23,50,77,.55), 0 0 0 1px rgba(23,50,77,.06); }
.pass-h { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; background: var(--teal); color: #fff; font-size: 12px; font-weight: 600; letter-spacing: .09em; }
.pass-h b { font-size: 15px; letter-spacing: 0; }
.pass-b { display: grid; grid-template-columns: 1fr 82px; gap: 10px; padding: 14px 16px 16px; }
.pass-id { display: flex; gap: 12px; align-items: center; grid-column: 1 / -1; }
.pass-id .t b { font-size: 22px; font-weight: 600; display: block; line-height: 1.15; }
.pass-id .t span { font-size: 13px; color: var(--muted); }
.ava { width: 64px; height: 64px; border-radius: 50%; background: var(--mint); color: var(--navy); overflow: hidden; display: grid; place-items: end center; flex: none; }
.ava svg { width: 92%; height: 92%; }
.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; align-content: start; }
.kv small { display: block; font-size: 11px; color: var(--muted); }
.kv strong { display: block; font-size: 13.5px; font-weight: 500; }
.qr { text-align: center; }
.qr svg { width: 82px; height: 82px; padding: 6px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 2px var(--mint); color: var(--navy); }
.pass-f { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: var(--mint); font-size: 12px; color: var(--teal-d); font-weight: 500; }
.pass-f code { font: 600 12.5px var(--font); }

.stack { position: relative; padding-top: 72px; }
.peek { position: absolute; left: 10px; right: 10px; height: 80px; border-radius: 20px; padding: 10px 16px; display: flex; justify-content: space-between; color: #fff; font-size: 14px; font-weight: 500; }
.peek span { display: flex; gap: 8px; align-items: center; height: 26px; }
.peek .mini { width: 26px; height: 26px; border-radius: 50%; background: var(--mint); overflow: hidden; color: var(--navy); display: grid; place-items: end center; }
.peek .mini svg { width: 100%; height: 100%; }
.peek.p1 { top: 0; left: 18px; right: 18px; background: #fff; color: var(--teal); border: 1.5px dashed var(--teal); }
.peek.p2 { top: 36px; background: var(--navy); }
.peek small { font-size: 12px; opacity: .75; font-weight: 400; }

/* todo tiles */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: #fff; border-radius: 18px; padding: 12px 14px; box-shadow: 0 0 0 1px var(--line); display: grid; gap: 6px; }
.tile .when { display: flex; align-items: baseline; gap: 4px; }
.tile .when b { font-size: 26px; font-weight: 600; line-height: 1; }
.tile .when span { font-size: 12.5px; color: var(--muted); }
.tile p { font-size: 13.5px; font-weight: 500; line-height: 1.35; }
.tile small { font-size: 12px; color: var(--muted); }
.tile.due { background: var(--due-bg); box-shadow: none; }
.tile.due .when b { color: var(--due); }

/* tabbar with center QR */
.tabbar { flex: none; position: relative; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; background: #fff; padding: 8px 0 22px; box-shadow: 0 -1px 0 var(--line); }
.tabbar a { display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--faint); text-decoration: none; position: relative; }
.tabbar a.on { color: var(--teal); font-weight: 500; }
.tabbar a.qrbtn { margin-top: -30px; color: var(--navy); }
.tabbar a.qrbtn i { width: 56px; height: 56px; border-radius: 18px; background: var(--navy); color: #fff; display: grid; place-items: center; box-shadow: 0 10px 18px -8px rgba(23,50,77,.6); border: 4px solid #fff; }
.tabbar a em { position: absolute; top: -3px; left: calc(50% + 5px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font: 600 10px/16px var(--font); font-style: normal; }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 50px; border-radius: 16px; font: 500 15px/1 var(--font); background: var(--teal); color: #fff; text-decoration: none; }
.btn.navy { background: var(--navy); }
.btn.soft { background: var(--mint); color: var(--teal-d); }
.btn.white { background: #fff; color: var(--navy); box-shadow: 0 0 0 1px var(--line); }
.btn.danger { background: var(--danger); }
.btn svg { width: 20px; height: 20px; }
.round { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #fff; box-shadow: 0 0 0 1px var(--line); color: var(--navy); flex: none; }
.round svg { width: 20px; height: 20px; }

/* info tiles */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.fact { background: #fff; border-radius: 16px; padding: 10px 12px; box-shadow: 0 0 0 1px var(--line); }
.fact small { display: block; font-size: 11.5px; color: var(--muted); }
.fact b { display: block; font-size: 14px; font-weight: 500; margin-top: 2px; }

/* flip toggle */
.flip { display: flex; justify-content: center; gap: 4px; padding: 4px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px var(--line); align-self: center; }
.flip span { font-size: 13px; padding: 6px 14px; border-radius: 999px; color: var(--muted); }
.flip span.on { background: var(--navy); color: #fff; }

.back-face { border-radius: 22px; background: var(--navy); color: #fff; padding: 18px 18px 16px; display: grid; justify-items: center; gap: 10px; text-align: center; box-shadow: 0 18px 30px -22px rgba(23,50,77,.7); }
.back-face .qrbig { width: 170px; height: 170px; background: #fff; border-radius: 18px; padding: 12px; color: var(--navy); }
.back-face b { font-size: 17px; font-weight: 600; }
.back-face p { font-size: 12.5px; color: #B9CADA; max-width: 30ch; }
.back-face code { font: 600 13px var(--font); background: rgba(255,255,255,.12); padding: 4px 10px; border-radius: 999px; }

/* form */
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 4px; border-radius: 2px; background: var(--mint-2); }
.steps i.on { background: var(--teal); }
.species { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.species div { background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line); padding: 10px 0 10px; display: grid; justify-items: center; gap: 4px; font-size: 13.5px; font-weight: 500; }
.species div .ava { width: 54px; height: 54px; }
.species div.on { box-shadow: 0 0 0 2px var(--teal); background: #F7FDFC; }
.species div.on::after { content: ""; }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.input { height: 50px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; justify-content: space-between; padding: 0 16px; font-size: 15px; }
.input.focus { box-shadow: 0 0 0 2px var(--teal); }
.input svg { width: 18px; height: 18px; color: var(--faint); }
.pills { display: flex; gap: 8px; }
.pills span { flex: 1; height: 50px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; font-size: 14.5px; }
.pills span.on { box-shadow: 0 0 0 2px var(--teal); color: var(--teal-d); font-weight: 500; }
.footer { flex: none; padding: 10px 16px 26px; display: flex; gap: 10px; }
.footer .btn { flex: 1; }

/* dialog */
.scrim { position: absolute; inset: 0; background: rgba(15, 30, 45, .55); z-index: 10; }
.dialog { position: absolute; left: 22px; right: 22px; top: 50%; transform: translateY(-50%); z-index: 11; background: #fff; border-radius: 26px; padding: 22px 20px 18px; text-align: center; display: grid; gap: 12px; }
.dialog .ava { margin: 0 auto; width: 72px; height: 72px; filter: grayscale(.4); }
.dialog h3 { margin: 0; font-size: 19px; font-weight: 600; }
.dialog p { font-size: 13.5px; color: var(--muted); line-height: 1.55; }
.dialog .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

/* calendar */
.cal { background: #fff; border-radius: 22px; padding: 14px 12px 10px; box-shadow: 0 0 0 1px var(--line); }
.cal-h { display: flex; justify-content: space-between; align-items: center; padding: 0 4px 8px; }
.cal-h b { font-size: 16px; font-weight: 500; }
.cal-h span { display: flex; gap: 6px; }
.cal-h span i { width: 28px; height: 28px; border-radius: 50%; background: var(--page); display: grid; place-items: center; color: var(--muted); }
.cal-h span svg { width: 16px; height: 16px; }
.cal-g { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; row-gap: 2px; font-size: 13px; }
.cal-g .dn { font-size: 11px; color: var(--faint); padding-bottom: 4px; }
.cal-g span { height: 34px; display: grid; place-items: center; position: relative; }
.cal-g span.o { color: #C2CFD6; }
.cal-g span.today { font-weight: 600; }
.cal-g span.today::before { content: ""; position: absolute; width: 32px; height: 32px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--navy); }
.cal-g span.sel { color: #fff; font-weight: 600; }
.cal-g span.sel::before { content: ""; position: absolute; width: 32px; height: 32px; border-radius: 50%; background: var(--teal); z-index: -1; }
.cal-g span[data-d]::after { content: ""; position: absolute; bottom: 1px; width: 5px; height: 5px; border-radius: 50%; background: var(--d); }
.ev { display: flex; gap: 12px; background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line); padding: 12px 14px; align-items: center; }
.ev .bar { width: 4px; align-self: stretch; border-radius: 2px; background: var(--c); }
.ev .t { flex: 1; }
.ev b { display: block; font-size: 14.5px; font-weight: 500; }
.ev span { font-size: 12.5px; color: var(--muted); }
.ev time { text-align: right; font-size: 12.5px; color: var(--muted); }
.ev time b { font-size: 15px; color: var(--navy); }
.badge { display: inline-block; font-size: 11.5px; font-weight: 500; padding: 3px 8px; border-radius: 999px; }
.badge.due { background: var(--due-bg); color: var(--due); }
.badge.ok { background: var(--ok-bg); color: var(--ok); }
.badge.plain { background: var(--page); color: var(--muted); }

/* pet switch header */
.petsw { display: flex; align-items: center; gap: 10px; }
.petsw .ava { width: 44px; height: 44px; }
.petsw b { font-size: 17px; font-weight: 600; display: block; }
.petsw span { font-size: 12.5px; color: var(--muted); }
.petsw .round { margin-left: auto; width: 34px; height: 34px; }
.tabs { display: flex; gap: 20px; border-bottom: 1px solid var(--line); }
.tabs span { padding: 0 0 10px; font-size: 14px; color: var(--muted); }
.tabs span.on { color: var(--navy); font-weight: 500; box-shadow: inset 0 -2.5px 0 var(--teal); }

.vax { background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line); padding: 14px; display: grid; gap: 8px; }
.vax-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.vax-top b { font-size: 15px; font-weight: 500; }
.vax-top span { display: block; font-size: 12.5px; color: var(--muted); }
.prog { height: 6px; border-radius: 3px; background: var(--mint); overflow: hidden; }
.prog i { display: block; height: 100%; background: var(--teal); border-radius: 3px; }
.prog.due i { background: #E08A3C; }
.vax-dates { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
.vax-dates b { color: var(--navy); font-weight: 500; }
.src { font-size: 11.5px; color: var(--faint); display: flex; gap: 6px; align-items: center; }
.src svg { width: 14px; height: 14px; }

/* map screen */
.mapfull { position: absolute; inset: 0; }
.mapfull svg.streets { width: 100%; height: 100%; display: block; }
.mpin { position: absolute; transform: translate(-50%, -100%); }
.mpin i { display: flex; align-items: center; gap: 4px; background: #fff; color: var(--navy); font: 500 12px var(--font); font-style: normal; padding: 5px 9px 5px 5px; border-radius: 999px; box-shadow: 0 6px 14px -6px rgba(23,50,77,.5); white-space: nowrap; }
.mpin i em { width: 22px; height: 22px; border-radius: 50%; background: var(--teal); color: #fff; display: grid; place-items: center; }
.mpin i em svg { width: 13px; height: 13px; }
.mpin.sel i { background: var(--navy); color: #fff; }
.mpin.sel i em { background: #fff; color: var(--navy); }
.me { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #2F7BEA; border: 3px solid #fff; box-shadow: 0 0 0 9px rgba(47,123,234,.18); }
.overlay-top { position: absolute; top: 80px; left: 14px; right: 14px; display: grid; gap: 8px; z-index: 2; }
.searchb { height: 48px; border-radius: 16px; background: #fff; display: flex; gap: 10px; align-items: center; padding: 0 14px; color: var(--faint); box-shadow: 0 8px 18px -10px rgba(23,50,77,.45); }
.searchb svg { width: 20px; height: 20px; color: var(--muted); }
.chips { display: flex; gap: 6px; overflow: hidden; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 999px; background: #fff; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; box-shadow: 0 0 0 1px var(--line); }
.chip.on { background: var(--teal); color: #fff; box-shadow: none; }
.carousel { position: absolute; left: 0; right: 0; bottom: 30px; display: flex; gap: 10px; padding: 0 14px; z-index: 2; }
.pcard { flex: none; width: 282px; background: #fff; border-radius: 20px; padding: 14px; box-shadow: 0 14px 28px -14px rgba(23,50,77,.5); display: grid; gap: 8px; }
.pcard b { font-size: 15px; font-weight: 500; }
.pcard p { font-size: 12.5px; color: var(--muted); }
.pcard .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 2px; }
.pcard .btn { height: 40px; border-radius: 12px; font-size: 13.5px; }

/* clinic */
.clinic-top { background: var(--teal); color: #fff; padding: 4px 18px 46px; }
.clinic-top b { display: block; font-size: 20px; font-weight: 600; line-height: 1.25; }
.clinic-top span { font-size: 13px; color: #CFEDEA; }
.clinic-top .open { display: inline-block; margin-top: 10px; font-size: 12px; background: rgba(255,255,255,.16); padding: 4px 10px; border-radius: 999px; color: #fff; }
.ctiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: -32px; padding: 0 16px; }
.ctile { background: #fff; border-radius: 18px; padding: 14px; box-shadow: 0 10px 20px -16px rgba(23,50,77,.5), 0 0 0 1px var(--line); display: grid; gap: 6px; }
.ctile i { width: 38px; height: 38px; border-radius: 12px; background: var(--mint); color: var(--teal); display: grid; place-items: center; }
.ctile i svg { width: 20px; height: 20px; }
.ctile b { font-size: 14.5px; font-weight: 500; }
.ctile span { font-size: 12px; color: var(--muted); }
.ctile.primary { background: var(--navy); color: #fff; }
.ctile.primary i { background: rgba(255,255,255,.14); color: #fff; }
.ctile.primary span { color: #B9CADA; }
.quickq { display: grid; gap: 8px; }
.quickq a { display: flex; align-items: center; justify-content: space-between; background: #fff; border-radius: 16px; padding: 13px 14px; box-shadow: 0 0 0 1px var(--line); font-size: 14px; color: var(--navy); text-decoration: none; }
.quickq a svg { width: 18px; height: 18px; color: var(--faint); }

/* notifications */
.ncard { background: #fff; border-radius: 18px; box-shadow: 0 0 0 1px var(--line); padding: 14px; display: grid; grid-template-columns: 40px 1fr; gap: 12px; position: relative; }
.ncard .ic { width: 40px; height: 40px; border-radius: 14px; background: var(--mint); color: var(--teal); display: grid; place-items: center; }
.ncard .ic svg { width: 20px; height: 20px; }
.ncard .ic.due { background: var(--due-bg); color: var(--due); }
.ncard b { font-size: 14.5px; font-weight: 500; display: block; line-height: 1.35; padding-right: 14px; }
.ncard p { font-size: 13px; color: var(--muted); margin-top: 2px; }
.ncard time { font-size: 11.5px; color: var(--faint); display: block; margin-top: 6px; }
.ncard.unread::after { content: ""; position: absolute; right: 14px; top: 18px; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
.ncard .nb { display: flex; gap: 8px; margin-top: 10px; }
.ncard .nb .btn { height: 36px; border-radius: 12px; font-size: 13px; padding: 0 14px; }
.daylabel { font-size: 13px; color: var(--muted); margin: 0 4px -8px; }
</style>
</head>
