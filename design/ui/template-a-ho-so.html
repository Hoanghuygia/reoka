<style>
/* Template A, "Hồ sơ": a clinical record book.
   Quiet grouped lists on a cool grey page; the brand pet card is the only loud object. */
:root {
  --font: "Be Vietnam Pro", system-ui, sans-serif;
  --teal: #087F8C; --teal-d: #066873; --navy: #17324D; --mint: #DDF4EF; --mint-l: #F0FAF7;
  --muted: #5B7083; --faint: #8A9BAA; --line: #E4EBEE; --page: #F4F7F8;
  --due: #A4510F; --due-bg: #FFF2E5; --ok: #1E7449; --ok-bg: #E4F4EB; --danger: #B83232;
  --app-bg: var(--page);
}
.screen { font-family: var(--font); color: var(--navy); font-size: 15px; line-height: 1.45; }
.content { flex: 1; overflow: hidden; padding: 4px 16px 16px; display: flex; flex-direction: column; gap: 18px; }
.content.flush { padding-top: 0; }

/* text */
.h1 { font-size: 22px; font-weight: 700; letter-spacing: -.01em; line-height: 1.25; margin: 0; }
.sub { color: var(--muted); font-size: 13px; margin: 2px 0 0; }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px; }
.sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; }
.sec-h a { font-size: 13px; color: var(--teal); text-decoration: none; font-weight: 500; }
.note { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: flex-start; line-height: 1.45; }
.note svg { width: 15px; height: 15px; margin-top: 1px; color: var(--faint); }

/* pet card (brand) */
.pcard { background: #fff; border-radius: 18px; overflow: hidden; box-shadow: 0 0 0 1px var(--line), 0 14px 28px -20px rgba(23,50,77,.5); }
.pcard-h { background: var(--teal); color: #fff; display: flex; justify-content: space-between; align-items: center; padding: 9px 14px; font-size: 11px; font-weight: 700; letter-spacing: .1em; }
.pcard-h b { letter-spacing: 0; font-size: 14px; }
.pcard-b { display: grid; grid-template-columns: 78px 1fr 72px; gap: 12px; padding: 14px 14px 14px; align-items: start; }
.avatar { width: 78px; height: 78px; border-radius: 50%; background: var(--mint); overflow: hidden; color: var(--navy); display: grid; place-items: end center; }
.avatar svg { width: 92%; height: 92%; }
.code { margin-top: 8px; text-align: center; font-size: 11px; font-weight: 700; color: var(--teal); background: var(--mint); border-radius: 999px; padding: 3px 0; }
.f { display: grid; gap: 5px; }
.f small { display: block; font-size: 10.5px; color: var(--muted); line-height: 1.2; }
.f strong { display: block; font-size: 14px; font-weight: 700; line-height: 1.25; }
.qrbox { text-align: center; }
.qrbox svg { width: 72px; height: 72px; padding: 5px; border-radius: 10px; border: 2px solid var(--mint); color: var(--navy); background: #fff; }
.qrbox span { display: block; font-size: 9.5px; color: var(--muted); line-height: 1.3; margin-top: 4px; }

/* grouped list */
.group { background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 52px; }
.row + .row { border-top: 1px solid var(--line); }
.row .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--mint-l); color: var(--teal); display: grid; place-items: center; flex: none; }
.row .ic svg { width: 19px; height: 19px; }
.row .t { flex: 1; min-width: 0; }
.row .t b { display: block; font-weight: 600; font-size: 14.5px; line-height: 1.3; }
.row .t span { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.row .k { color: var(--muted); font-size: 14px; }
.row .v { font-weight: 600; font-size: 14px; text-align: right; }
.row > .chev { width: 18px; height: 18px; color: var(--faint); }
.datebox { width: 44px; flex: none; text-align: center; border-radius: 10px; background: var(--mint-l); padding: 4px 0 5px; }
.datebox small { display: block; font-size: 10.5px; color: var(--teal); font-weight: 600; }
.datebox b { display: block; font-size: 18px; line-height: 1.1; color: var(--navy); }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.tag.due { color: var(--due); background: var(--due-bg); }
.tag.ok { color: var(--ok); background: var(--ok-bg); }
.tag.plain { color: var(--muted); background: var(--page); }

/* quick grid */
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.quick a { display: grid; justify-items: center; gap: 6px; text-decoration: none; color: var(--navy); font-size: 11.5px; font-weight: 500; text-align: center; line-height: 1.25; }
.quick a i { width: 52px; height: 52px; border-radius: 16px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; color: var(--teal); }

/* buttons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; height: 46px; border-radius: 12px; font: 600 15px/1 var(--font); border: 0; background: var(--teal); color: #fff; width: 100%; }
.btn.ghost { background: #fff; color: var(--navy); box-shadow: 0 0 0 1px var(--line); }
.btn.soft { background: var(--mint); color: var(--teal-d); }
.btn.danger { background: var(--danger); }
.btn svg { width: 19px; height: 19px; }
.actions { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.actions .btn { height: 60px; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 500; }

/* tabbar */
.tabbar { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); background: #fff; border-top: 1px solid var(--line); padding: 7px 0 22px; }
.tabbar a { display: grid; justify-items: center; gap: 3px; font-size: 11px; color: var(--faint); text-decoration: none; position: relative; }
.tabbar a.on { color: var(--teal); font-weight: 600; }
.tabbar a em { position: absolute; top: -3px; left: calc(50% + 6px); min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; background: var(--danger); color: #fff; font: 700 10px/16px var(--font); font-style: normal; }

/* segmented */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: #E8EEF0; border-radius: 10px; padding: 3px; }
.seg span { text-align: center; font-size: 13px; font-weight: 500; padding: 6px 0; border-radius: 8px; color: var(--muted); }
.seg span.on { background: #fff; color: var(--navy); font-weight: 600; box-shadow: 0 1px 2px rgba(23,50,77,.12); }

/* chips */
.chips { display: flex; gap: 6px; overflow: hidden; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; background: #fff; box-shadow: 0 0 0 1px var(--line); font-size: 13px; font-weight: 500; }
.chip.on { background: var(--navy); color: #fff; box-shadow: none; }
.chip .mini { width: 20px; height: 20px; margin-left: -6px; border-radius: 50%; background: var(--mint); color: var(--navy); overflow: hidden; display: grid; place-items: end center; }
.chip .mini svg { width: 100%; height: 100%; }

/* form */
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field label em { color: var(--danger); font-style: normal; }
.input { height: 44px; border-radius: 12px; background: #fff; box-shadow: 0 0 0 1px var(--line); display: flex; align-items: center; padding: 0 14px; font-size: 15px; justify-content: space-between; }
.input.focus { box-shadow: 0 0 0 2px var(--teal); }
.input .ph { color: var(--faint); }
.input svg { width: 18px; height: 18px; color: var(--faint); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.photo { display: flex; align-items: center; gap: 14px; }
.photo .avatar { width: 72px; height: 72px; position: relative; }
.photo .cam { position: absolute; }
.toggle { width: 44px; height: 26px; border-radius: 13px; background: var(--teal); position: relative; flex: none; }
.toggle::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; }
.toggle.off { background: #CBD6DC; }
.toggle.off::after { right: auto; left: 3px; }
.footer { flex: none; padding: 10px 16px 26px; background: #fff; border-top: 1px solid var(--line); }

/* week strip */
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
.week div { padding: 6px 0 8px; border-radius: 12px; font-size: 11px; color: var(--muted); }
.week b { display: block; font-size: 16px; color: var(--navy); margin-top: 2px; }
.week div.today { background: var(--navy); color: #C9D6E2; }
.week div.today b { color: #fff; }
.week div.has b::after { content: ""; display: block; width: 5px; height: 5px; border-radius: 50%; background: var(--teal); margin: 3px auto 0; }
.week div.today.has b::after { background: #7FD3CB; }

/* record */
.rec { background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); padding: 14px; }
.rec-top { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.rec-top b { font-size: 15px; }
.rec-top time { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.rec-meta { font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.rec dl { margin: 12px 0 0; display: grid; grid-template-columns: 88px 1fr; gap: 7px 10px; font-size: 13.5px; }
.rec dt { color: var(--muted); }
.rec dd { margin: 0; font-weight: 500; }
.rec .src { margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.timeline { position: relative; display: grid; gap: 10px; }
.mini-rec { display: flex; gap: 12px; background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); padding: 12px 14px; align-items: center; }
.mini-rec .ic { width: 34px; height: 34px; border-radius: 10px; background: var(--mint-l); color: var(--teal); display: grid; place-items: center; flex: none; }
.mini-rec .ic svg { width: 18px; height: 18px; }
.mini-rec .t { flex: 1; }
.mini-rec b { display: block; font-size: 14.5px; font-weight: 600; }
.mini-rec span { display: block; font-size: 12.5px; color: var(--muted); }
.mini-rec time { font-size: 12px; color: var(--muted); }

/* map */
.map { position: relative; height: 250px; flex: none; background: #E7EEE9; overflow: hidden; }
.map svg.streets { position: absolute; inset: 0; width: 100%; height: 100%; }
.mpin { position: absolute; transform: translate(-50%, -100%); display: grid; justify-items: center; }
.mpin i { width: 34px; height: 34px; border-radius: 50% 50% 50% 4px; transform: rotate(-45deg); background: var(--teal); display: grid; place-items: center; box-shadow: 0 4px 10px -2px rgba(23,50,77,.4); border: 2px solid #fff; }
.mpin i svg { transform: rotate(45deg); width: 17px; height: 17px; color: #fff; }
.mpin.sel i { background: var(--navy); width: 40px; height: 40px; }
.me { position: absolute; width: 16px; height: 16px; border-radius: 50%; background: #2F7BEA; border: 3px solid #fff; box-shadow: 0 0 0 8px rgba(47,123,234,.18); }
.search { position: absolute; top: 10px; left: 12px; right: 12px; height: 44px; border-radius: 12px; background: #fff; display: flex; align-items: center; gap: 10px; padding: 0 12px; box-shadow: 0 6px 16px -8px rgba(23,50,77,.4); font-size: 14px; color: var(--faint); }
.search svg { width: 19px; height: 19px; color: var(--muted); }
.sheet { flex: 1; margin-top: -18px; position: relative; background: var(--page); border-radius: 18px 18px 0 0; padding: 8px 16px 16px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; }
.grab { width: 36px; height: 4px; border-radius: 2px; background: #CBD6DC; margin: 0 auto 2px; }
.place { background: #fff; border-radius: 14px; box-shadow: 0 0 0 1px var(--line); padding: 12px 14px; }
.place.sel { box-shadow: 0 0 0 2px var(--teal); }
.place-top { display: flex; justify-content: space-between; gap: 8px; }
.place-top b { font-size: 14.5px; font-weight: 600; line-height: 1.3; }
.place-top span { font-size: 13px; color: var(--muted); white-space: nowrap; }
.place p { margin: 3px 0 8px; font-size: 12.5px; color: var(--muted); }
.place .tags { display: flex; gap: 5px; flex-wrap: wrap; }
.place .pbtns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
.place .pbtns .btn { height: 38px; font-size: 13.5px; }

/* clinic */
.clinic-hero { background: #fff; border-radius: 16px; box-shadow: 0 0 0 1px var(--line); padding: 16px; display: grid; gap: 12px; }
.clinic-id { display: flex; gap: 12px; align-items: center; }
.clinic-logo { width: 52px; height: 52px; border-radius: 14px; background: var(--navy); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 18px; flex: none; }
.clinic-id b { font-size: 16px; display: block; line-height: 1.3; }
.clinic-id span { font-size: 12.5px; color: var(--muted); }
.cta3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.cta3 .btn { height: 64px; flex-direction: column; gap: 5px; font-size: 12.5px; font-weight: 600; }
.hours { display: grid; grid-template-columns: 1fr auto; gap: 6px; font-size: 13.5px; padding: 12px 14px; }
.hours span:nth-child(odd) { color: var(--muted); }
.hours .now { color: var(--ok); font-weight: 600; }

/* notifications */
.noti { display: flex; gap: 12px; padding: 13px 14px; position: relative; }
.noti + .noti { border-top: 1px solid var(--line); }
.noti .ic { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--mint-l); color: var(--teal); }
.noti .ic svg { width: 18px; height: 18px; }
.noti .ic.due { background: var(--due-bg); color: var(--due); }
.noti .t { flex: 1; }
.noti b { display: block; font-size: 14px; font-weight: 600; line-height: 1.35; }
.noti p { margin: 2px 0 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
.noti time { display: block; font-size: 11.5px; color: var(--faint); margin-top: 4px; }
.noti.unread { background: #F6FCFB; }
.noti.unread::after { content: ""; position: absolute; top: 18px; right: 14px; width: 8px; height: 8px; border-radius: 50%; background: var(--teal); }
.noti .inline-btn { display: inline-flex; margin-top: 8px; height: 30px; align-items: center; padding: 0 12px; border-radius: 8px; background: var(--mint); color: var(--teal-d); font-size: 12.5px; font-weight: 600; }

/* dialog */
.scrim { position: absolute; inset: 0; background: rgba(15, 30, 45, .5); z-index: 10; }
.bsheet { position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: #fff; border-radius: 22px 22px 0 0; padding: 10px 20px 30px; display: grid; gap: 14px; }
.bsheet h3 { margin: 6px 0 0; font-size: 18px; }
.bsheet p { margin: 0; font-size: 14px; color: var(--muted); line-height: 1.55; }
.bsheet ul { margin: 0; padding: 12px 14px; list-style: none; background: var(--page); border-radius: 12px; display: grid; gap: 8px; font-size: 13.5px; }
.bsheet li { display: flex; gap: 8px; }
.bsheet li svg { width: 17px; height: 17px; color: var(--teal); margin-top: 1px; }
</style>
</head>
